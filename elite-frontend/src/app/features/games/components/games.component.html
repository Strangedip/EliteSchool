<div class="games-page" [class.embedded]="embedded">
  <div class="games-shell">
    @if (!embedded) {
      <header class="games-topbar">
        <a routerLink="/home" class="brand-link">
          <app-brand-mark [size]="32" />
          <span>EliteSchool</span>
        </a>
        <nav class="games-nav">
          <button
            type="button"
            class="theme-toggle-btn"
            (click)="toggleTheme()"
            [title]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
            <i class="pi" [class.pi-sun]="themeService.isDark()" [class.pi-moon]="!themeService.isDark()"></i>
          </button>
          <a routerLink="/home">Home</a>
          <a routerLink="/docs">Docs</a>
          <a routerLink="/login">Sign In</a>
        </nav>
      </header>
    }

    @if (!isPlaying) {
      <div class="games-header">
        <p class="games-kicker">Brain training</p>
        <h1>Think harder</h1>
        <p>Optional cognitive games for memory, logic, and number sense — they never award Elite Points.</p>
      </div>

      <div class="games-grid">
        @for (game of games; track game.id) {
          <article class="game-card">
            <div class="game-visual">
              <img [src]="game.imageUrl" [alt]="game.name" width="480" height="300" loading="lazy"
                (error)="$any($event.target).src = 'assets/images/games/game-placeholder.svg'" />
            </div>
            <div class="game-body">
              <p class="game-skill">{{ game.skill }}</p>
              <h2>{{ game.name }}</h2>
              <p>{{ game.description }}</p>
              <p-button label="Train" icon="pi pi-play" (onClick)="navigateToGame(game.route)" styleClass="play-btn"></p-button>
            </div>
          </article>
        }
      </div>
    }

    <router-outlet></router-outlet>
  </div>
</div>
