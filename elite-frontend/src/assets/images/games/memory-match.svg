<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none" role="img" aria-label="Memory Match">
  <defs>
    <linearGradient id="mm-bg" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="mm-card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#mm-bg)"/>
  <circle cx="420" cy="40" r="90" fill="#00b4d8" opacity=".18"/>
  <circle cx="40" cy="260" r="70" fill="#48cae4" opacity=".14"/>

  <!-- 2x4 memory grid -->
  <g transform="translate(72,54)">
    <rect x="0" y="0" width="72" height="88" rx="12" fill="#0c4a6e" opacity=".55"/>
    <rect x="88" y="0" width="72" height="88" rx="12" fill="url(#mm-card)"/>
    <circle cx="124" cy="44" r="14" fill="#0369a1"/>
    <rect x="176" y="0" width="72" height="88" rx="12" fill="#0c4a6e" opacity=".55"/>
    <rect x="264" y="0" width="72" height="88" rx="12" fill="url(#mm-card)"/>
    <rect x="282" y="30" width="36" height="36" rx="6" fill="#0e7490"/>

    <rect x="0" y="104" width="72" height="88" rx="12" fill="url(#mm-card)"/>
    <rect x="18" y="134" width="36" height="36" rx="6" fill="#0e7490"/>
    <rect x="88" y="104" width="72" height="88" rx="12" fill="#0c4a6e" opacity=".55"/>
    <rect x="176" y="104" width="72" height="88" rx="12" fill="url(#mm-card)"/>
    <circle cx="212" cy="148" r="14" fill="#0369a1"/>
    <rect x="264" y="104" width="72" height="88" rx="12" fill="#0c4a6e" opacity=".55"/>
  </g>
</svg>
