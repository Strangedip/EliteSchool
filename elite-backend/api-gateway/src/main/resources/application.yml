server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:consul:${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}"
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      config:
        fail-fast: false
        format: yaml
      discovery:
        hostname: ${SERVICE_HOSTNAME:localhost}
        prefer-ip-address: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: auth-service-auth
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - PreserveHostHeader

            - id: auth-service-user
              uri: lb://auth-service
              predicates:
                - Path=/api/user/**
              filters:
                - PreserveHostHeader

            - id: auth-service-courses
              uri: lb://auth-service
              predicates:
                - Path=/api/courses/**
              filters:
                - PreserveHostHeader

            - id: auth-service-support
              uri: lb://auth-service
              predicates:
                - Path=/api/support/**
              filters:
                - PreserveHostHeader

            - id: task-service-tasks
              uri: lb://task-service
              predicates:
                - Path=/api/tasks/**
              filters:
                - PreserveHostHeader

            - id: task-service-templates
              uri: lb://task-service
              predicates:
                - Path=/api/task-templates/**
              filters:
                - PreserveHostHeader

            - id: task-service-submissions
              uri: lb://task-service
              predicates:
                - Path=/api/task-submissions/**
              filters:
                - PreserveHostHeader

            - id: wallet-service
              uri: lb://wallet-service
              predicates:
                - Path=/api/wallet/**
              filters:
                - PreserveHostHeader

            - id: store-service
              uri: lb://store-service
              predicates:
                - Path=/api/store/**
              filters:
                - PreserveHostHeader

          default-filters:
            - PreserveHostHeader
            - RemoveRequestHeader=Cookie

# JWT Configuration (for token validation in gateway) — overridable via Consul KV
jwt:
  secret: ${JWT_SECRET:wJjY8fXo+G6Vkhd4yLh3JOp6tH8l29PY5zR0DboYdxM=}
  cookie-name: AUTH_TOKEN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
