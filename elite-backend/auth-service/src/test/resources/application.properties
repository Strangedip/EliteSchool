# Test profile: no Consul registration, in-memory H2
spring.cloud.consul.enabled=false
spring.cloud.consul.config.enabled=false
spring.cloud.consul.discovery.enabled=false
spring.cloud.consul.discovery.register=false
spring.config.import=optional:consul:

spring.datasource.url=jdbc:h2:mem:auth_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=wJjY8fXo+G6Vkhd4yLh3JOp6tH8l29PY5zR0DboYdxM=
jwt.expiration=3600000
jwt.cookie-name=AUTH_TOKEN
jwt.cookie-secure=false

spring.mail.host=localhost
spring.mail.port=1025
app.password-reset.frontend-url=http://localhost:4200
app.demo-admin.enabled=false
