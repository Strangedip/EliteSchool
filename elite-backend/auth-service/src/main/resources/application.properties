# Server Configuration
server.port=8081
# ===============================

# Spring Application Name (also the Consul service-id and KV config key)
spring.application.name=auth-service
# ===============================

# Consul Service Discovery & KV Config
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.hostname=${SERVICE_HOSTNAME:localhost}
spring.cloud.consul.discovery.prefer-ip-address=false
spring.cloud.consul.config.fail-fast=false
spring.cloud.consul.config.format=yaml
spring.config.import=optional:consul:${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}
management.endpoints.web.exposure.include=health
# ===============================

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:EliteSchool}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
# ===============================

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# ===============================

# JWT Configuration (For Token Authentication) — overridable via Consul KV
jwt.secret=${JWT_SECRET:wJjY8fXo+G6Vkhd4yLh3JOp6tH8l29PY5zR0DboYdxM=}
jwt.expiration=3600000
jwt.cookie-name=AUTH_TOKEN
jwt.cookie-secure=false
# ===============================

# ===============================
# EMAIL CONFIGURATION (For Password Reset)
# ===============================
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.properties.mail.from.name=${EMAIL_FROM_NAME:EliteSchool Support}
spring.mail.properties.mail.from.email=${EMAIL_FROM:${EMAIL_USERNAME:noreply@eliteschool.com}}

# ===============================
# PASSWORD RESET CONFIGURATION
# ===============================
# Token expiry time in minutes (default: 30 minutes)
app.password-reset.token-expiry-minutes=30

# Frontend URL for reset link (update for production)
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Rate limiting: Max password reset requests per email per hour
app.password-reset.max-requests-per-hour=3

# ===============================
# THYMELEAF CONFIGURATION (For Email Templates)
# ===============================
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

spring.threads.virtual.enabled=true
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.defer-datasource-initialization=true

