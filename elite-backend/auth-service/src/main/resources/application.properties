# Server Configuration
server.port=8081
# ===============================

# Spring Application Name (For Eureka)
spring.application.name=auth-service
# ===============================

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# ===============================

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/EliteSchool
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
# ===============================

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# ===============================

# JWT Configuration (For Token Authentication)
jwt.secret=wJjY8fXo+G6Vkhd4yLh3JOp6tH8l29PY5zR0DboYdxM=
jwt.expiration=3600000
jwt.cookie-name=AUTH_TOKEN
# ===============================

# Spring Security (Optional Debugging)
spring.security.user.name=admin
spring.security.user.password=admin
# ===============================

# ===============================
# EMAIL CONFIGURATION (For Password Reset)
# ===============================
# SMTP Server Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}

# SMTP Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Sender Details
spring.mail.properties.mail.from.name=EliteSchool Support
spring.mail.properties.mail.from.email=${EMAIL_USERNAME:noreply@eliteschool.com}

# ===============================
# PASSWORD RESET CONFIGURATION
# ===============================
# Token expiry time in minutes (default: 30 minutes)
app.password-reset.token-expiry-minutes=30

# Frontend URL for reset link (update for production)
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Rate limiting: Max password reset requests per email per hour
app.password-reset.max-requests-per-hour=3

# ===============================
# THYMELEAF CONFIGURATION (For Email Templates)
# ===============================
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
