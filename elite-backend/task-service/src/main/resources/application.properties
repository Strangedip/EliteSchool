
# Server Configuration
server.port=8082
# ===============================

# Spring Application Name (also the Consul service-id and KV config key)
spring.application.name=task-service
# ===============================

# Consul Service Discovery & KV Config
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.hostname=${SERVICE_HOSTNAME:localhost}
spring.cloud.consul.discovery.prefer-ip-address=false
spring.cloud.consul.config.fail-fast=false
spring.cloud.consul.config.format=yaml
spring.config.import=optional:consul:${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}
management.endpoints.web.exposure.include=health
# ===============================

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:EliteSchool}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
# ===============================

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# ===============================

# JWT Configuration (For Token Authentication) — overridable via Consul KV
jwt.secret=${JWT_SECRET:wJjY8fXo+G6Vkhd4yLh3JOp6tH8l29PY5zR0DboYdxM=}
jwt.expiration=3600000
# ===============================


spring.threads.virtual.enabled=true
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.defer-datasource-initialization=true

