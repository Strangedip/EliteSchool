server:
  port: 8888

spring:
  application:
    name: config-server
  
  # Security credentials for config server
  security:
    user:
      name: ${CONFIG_SERVER_USER:configuser}
      password: ${CONFIG_SERVER_PASSWORD:configpass}

  cloud:
    config:
      server:
        git:
          # GitHub repository URL (CHANGE THIS to your repo)
          uri: ${CONFIG_REPO_URI:https://github.com/YOUR_USERNAME/eliteschool-config}
          
          # Branch to use
          default-label: ${CONFIG_REPO_BRANCH:main}
          
          # Search paths for different environments
          search-paths:
            - '{profile}'
          
          # Clone on startup for faster first request
          clone-on-start: true
          
          # For private repos - set these env vars
          username: ${CONFIG_REPO_USERNAME:}
          password: ${CONFIG_REPO_TOKEN:}
          
          # Timeout settings
          timeout: 10
          
          # Force pull to get latest
          force-pull: true

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.springframework.cloud.config: INFO

