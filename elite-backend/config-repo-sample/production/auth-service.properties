# Auth Service - Production Configuration

server.port=8081

# Database (Production)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI}
eureka.instance.prefer-ip-address=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=1800000
jwt.cookie-name=AUTH_TOKEN

# Email (Production - SendGrid/AWS SES)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.from.name=EliteSchool

# Password Reset
app.password-reset.token-expiry-minutes=15
app.password-reset.frontend-url=${FRONTEND_URL}
app.password-reset.max-requests-per-hour=3

# Thymeleaf
spring.thymeleaf.cache=true

# Logging
logging.level.root=WARN
logging.level.com.eliteschool=INFO

