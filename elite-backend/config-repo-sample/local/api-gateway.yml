# API Gateway - Local Configuration

server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**, /api/user/**
        - id: task-service
          uri: lb://task-service
          predicates:
            - Path=/api/tasks/**, /api/task-submissions/**
        - id: wallet-service
          uri: lb://wallet-service
          predicates:
            - Path=/api/wallet/**
        - id: store-service
          uri: lb://store-service
          predicates:
            - Path=/api/store/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: wJjY8fXo+G6Vkhd4yLh3JOp6tH8l29PY5zR0DboYdxM=

management:
  endpoints:
    web:
      exposure:
        include: health,info

