# Auth Service - Local Configuration
# Place this in: github.com/YOUR_USERNAME/eliteschool-config/local/

server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/EliteSchool
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT
jwt.secret=wJjY8fXo+G6Vkhd4yLh3JOp6tH8l29PY5zR0DboYdxM=
jwt.expiration=3600000
jwt.cookie-name=AUTH_TOKEN

# Email (Local - use your test account)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-test-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.from.name=EliteSchool Local

# Password Reset
app.password-reset.token-expiry-minutes=30
app.password-reset.frontend-url=http://localhost:4200
app.password-reset.max-requests-per-hour=10

# Thymeleaf
spring.thymeleaf.cache=false

