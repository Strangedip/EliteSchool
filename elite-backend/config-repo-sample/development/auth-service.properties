# Auth Service - Development Configuration

server.port=8081

# Database (Dev server)
spring.datasource.url=jdbc:postgresql://dev-db-server:5432/EliteSchool_Dev
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Eureka
eureka.client.service-url.defaultZone=http://dev-eureka:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.cookie-name=AUTH_TOKEN

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.from.name=EliteSchool Dev

# Password Reset
app.password-reset.token-expiry-minutes=30
app.password-reset.frontend-url=https://dev.eliteschool.com
app.password-reset.max-requests-per-hour=5

# Thymeleaf
spring.thymeleaf.cache=true

